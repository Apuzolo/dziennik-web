<!DOCTYPE html>
<html>
<head>
  <base href="/dziennik-web/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta
    name="description"
    content="Twój inteligentny dziennik szkolny"
  >

  <meta name="theme-color" content="#0B0D10">

  <!-- PWA / iPhone -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="black-translucent"
  >
  <meta
    name="apple-mobile-web-app-title"
    content="Dziennik"
  >

  <link
    rel="apple-touch-icon"
    sizes="180x180"
    href="icons/apple-touch-icon.png"
  >
  <link
    rel="icon"
    type="image/png"
    href="favicon.png"
  >
  <link
    rel="manifest"
    href="manifest.json"
  >

  <title>Dziennik</title>

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      background: #0B0D10;
      color: #F7F8FA;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
    }

    #app-loading {
      position: fixed;
      inset: 0;
      z-index: 999999;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(circle at 50% 38%, rgba(49, 111, 255, 0.18), transparent 34%),
        #0B0D10;
      transition: opacity 220ms ease;
    }

    #app-loading.hide {
      opacity: 0;
      pointer-events: none;
    }

    .loading-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
      padding: 24px;
    }

    .loading-icon {
      width: 112px;
      height: 112px;
      border-radius: 27px;
      box-shadow:
        0 18px 55px rgba(0, 68, 255, 0.26),
        0 0 0 1px rgba(255, 255, 255, 0.04);
    }

    .loading-title {
      margin: 0;
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.4px;
    }

    .loading-subtitle {
      margin-top: -10px;
      font-size: 13px;
      color: rgba(255, 255, 255, 0.58);
    }

    .loading-bar {
      width: 116px;
      height: 3px;
      overflow: hidden;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.09);
    }

    .loading-bar::after {
      content: "";
      display: block;
      width: 45%;
      height: 100%;
      border-radius: inherit;
      background: #6292FF;
      animation: loading-slide 1.1s ease-in-out infinite;
    }

    @keyframes loading-slide {
      0% {
        transform: translateX(-110%);
      }
      50% {
        transform: translateX(110%);
      }
      100% {
        transform: translateX(260%);
      }
    }
  </style>
</head>

<body>
  <div id="app-loading">
    <div class="loading-content">
      <img
        class="loading-icon"
        src="icons/Icon-192.png"
        alt=""
      >
      <p class="loading-title">Dziennik</p>
      <div class="loading-subtitle">Uruchamianie aplikacji…</div>
      <div class="loading-bar"></div>
    </div>
  </div>

  <script>
    window.addEventListener('flutter-first-frame', function () {
      const loading = document.getElementById('app-loading');

      if (!loading) {
        return;
      }

      loading.classList.add('hide');

      setTimeout(function () {
        loading.remove();
      }, 250);
    });
  </script>

  <script
    src="flutter_bootstrap.js"
    async
  ></script>
</body>
</html>
